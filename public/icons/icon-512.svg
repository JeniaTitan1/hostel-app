<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners for mobile icon -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow)" stroke-width="12" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Center MNAU 'M' Monogram with Hostel Roof Building motif -->
  <g filter="url(#shadow)">
    <!-- Roof / Crest Top -->
    <path d="M256 96 L376 192 L340 192 L256 126 L172 192 L136 192 Z" fill="#34d399" />
    
    <!-- Stylized 'M' Letter -->
    <path d="M148 208 L192 208 L256 312 L320 208 L364 208 L364 384 L316 384 L316 288 L268 368 L244 368 L196 288 L196 384 L148 384 Z" fill="#ffffff" />
    
    <!-- Small Keyhole / Digital Beacon Indicator -->
    <circle cx="256" cy="420" r="16" fill="#34d399" />
  </g>
</svg>
